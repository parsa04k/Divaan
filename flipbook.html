<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کاتالوگ دیجیتال دیوان - فلیپ بوک 16:9</title>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- StPageFlip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
        }

        /* کانتینر اصلی فلیپ بوک */
        #flipbook-container {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            background: #fff;
            overflow: hidden;
            width: 100%;
            max-width: 1700px; 
            margin: 0 auto;
            display: none; /* ابتدا مخفی است تا فایل لود شود */
        }

        /* استایل صفحات */
        .my-page {
            background-color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .my-page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* استایل لودینگ */
        #loading {
            font-size: 1.2rem;
            color: #ecf0f1;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div id="loading">در حال بارگذاری کاتالوگ، لطفاً شکیبا باشید...</div>

    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <script>
        // ==========================================
        // مسیر فایل PDF خود را اینجا وارد کنید
        // ==========================================
        const PDF_URL = 'catalog.pdf'; // نام فایل PDF که در گیت هاب آپلود می کنید


        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function loadFlipbook() {
            try {
                // دریافت فایل PDF از مسیر مشخص شده
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
                const flipbookElement = document.getElementById('flipbook');
                
                flipbookElement.innerHTML = ''; 

                // رندر کردن تمام صفحات PDF
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 }); // کیفیت بالا
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'my-page';
                    pageDiv.appendChild(canvas);
                    
                    flipbookElement.appendChild(pageDiv);
                }

                // پنهان کردن پیام لودینگ و نمایش دفتر
                document.getElementById('loading').style.display = 'none';
                document.getElementById('flipbook-container').style.display = 'block';

                // راه‌اندازی کتابخانه فلیپ بوک با ابعاد 16:9 افقی
                const pageFlip = new St.PageFlip(flipbookElement, {
                    width: 800,          // عرض پایه (16)
                    height: 450,         // ارتفاع پایه (9)
                    size: 'stretch',     
                    minWidth: 400,       
                    maxWidth: 1200,      
                    minHeight: 225,      
                    maxHeight: 675,      
                    drawShadow: true,    
                    flippingTime: 800,   
                    usePortrait: true,   
                    startZIndex: 0,
                    autoSize: true,
                    maxShadowOpacity: 0.5,
                    showCover: true,     // جلد اول و آخر تک صفحه ای
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

            } catch (error) {
                console.error("Error loading PDF: ", error);
                document.getElementById('loading').innerText = "خطا در بارگذاری فایل PDF. لطفا نام فایل و مسیر آن را بررسی کنید.";
            }
        }

        // اجرای خودکار تابع هنگام باز شدن صفحه
        window.onload = loadFlipbook;
    </script>
</body>
</html>
