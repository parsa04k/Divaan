<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کاتالوگ دیجیتال دیوان - فلیپ بوک چوبی</title>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- StPageFlip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            /* پس‌زمینه چوبی اختصاصی شما */
            background-image: url('wood.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #3e2723; 
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            color: #fff;
        }

        /* کانتینر اصلی فلیپ بوک */
        #flipbook-container {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 8px rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
            width: 100%;
            max-width: 1700px; /* فضای کافی برای نمایش دو صفحه 16:9 */
            margin: 0 auto;
            display: none;
            /* اعمال راست‌چین برای ورق خوردن از راست به چپ */
            direction: rtl; 
        }

        /* استایل صفحات */
        .my-page {
            background-color: white;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .my-page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* استایل لودینگ و خطا */
        #loading, #error-message {
            font-size: 1.5rem;
            color: #fff;
            text-align: center;
            margin-top: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        #error-message { color: #ff6b6b; display: none; }
    </style>
</head>
<body>

    <div id="loading">در حال آماده‌سازی دفتر چوبی، لطفاً شکیبا باشید...</div>
    <div id="error-message"></div>

    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <script>
        // ⚠️ نام فایل PDF خود را اینجا وارد کنید (ترجیحا به انگلیسی)
        const PDF_URL = 'catalog.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function loadFlipbook() {
            try {
                const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
                const flipbookElement = document.getElementById('flipbook');
                
                flipbookElement.innerHTML = ''; 

                // رندر کردن تمام صفحات PDF
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    // مقیاس 2.0 برای کیفیت بالا در صفحات بزرگ
                    const viewport = page.getViewport({ scale: 2.0 }); 
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'my-page';
                    pageDiv.appendChild(canvas);
                    
                    flipbookElement.appendChild(pageDiv);
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('flipbook-container').style.display = 'block';

                // راه‌اندازی کتابخانه فلیپ بوک با تنظیمات دقیق
                const pageFlip = new St.PageFlip(flipbookElement, {
                    width: 800,          // عرض پایه هر صفحه
                    height: 450,         // ارتفاع پایه هر صفحه (نسبت 16:9)
                    size: 'stretch',     
                    minWidth: 400,       
                    maxWidth: 1200,      
                    minHeight: 225,      
                    maxHeight: 675,      
                    drawShadow: true,    // ایجاد سایه بین صفحات
                    flippingTime: 800,   // سرعت ورق زدن (میلی‌ثانیه)
                    usePortrait: true,   // در موبایل تک‌صفحه‌ای، در دسکتاپ دو صفحه‌ای
                    startZIndex: 0,
                    autoSize: true,
                    maxShadowOpacity: 0.6, 
                    
                    // *** تنظیمات کلیدی برای خواسته شما ***
                    showCover: true,     // جلد اول و آخر تک‌صفحه و در وسط
                    direction: 'rtl',    // ورق زدن از راست به چپ
                    
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

            } catch (error) {
                console.error("Error loading PDF: ", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').innerHTML = 
                    "خطا در بارگذاری فایل PDF.<br>لطفا مطمئن شوید فایل '" + PDF_URL + "' و عکس 'wood.jpg' در همان پوشه فایل index.html قرار دارند.";
            }
        }

        window.onload = loadFlipbook;
    </script>
</body>
</html>
