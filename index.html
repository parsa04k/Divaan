<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کاتالوگ دیجیتال دیوان - فلیپ بوک</title>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- StPageFlip Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            /* پس‌زمینه چوبی */
            background-image: url('wood.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #3e2723;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Tahoma', 'Arial', sans-serif;
            padding: 15px;
            overflow-x: hidden;
        }

        /* کانتینر اصلی فلیپ بوک */
        #flipbook-container {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 6px rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
            width: 100%;
            max-width: 1700px; 
            display: none;
            direction: rtl;
            transition: all 0.3s ease;
        }

        /* استایل صفحات */
        .my-page {
            background-color: white;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .my-page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* استایل لودینگ و خطا */
        #loading, #error-message {
            font-size: 1.3rem;
            color: #fff;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 30px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #error-message { color: #ff6b6b; display: none; }

        /* ============================================
           تنظیمات موبایل (Responsive)
           ============================================ */
        @media (max-width: 768px) {
            body {
                padding: 8px;
                align-items: center;
                justify-content: center;
            }

            #flipbook-container {
                /* در موبایل ارتفاع رو محدود می‌کنیم تا کل صفحه دیده بشه */
                max-width: 100%;
                max-height: calc(100vh - 30px);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
                border-radius: 4px;
            }

            #loading, #error-message {
                font-size: 1rem;
                padding: 15px 20px;
                width: 85%;
            }
        }

        /* در گوشی‌های خیلی کوچک */
        @media (max-width: 400px) {
            body { padding: 5px; }
            #flipbook-container { border-radius: 3px; }
        }
    </style>
</head>
<body>

    <div id="loading">در حال آماده‌سازی دفتر، لطفاً شکیبا باشید...</div>
    <div id="error-message"></div>

    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>

    <script>
        // ⚠️ نام فایل PDF خود را اینجا وارد کنید
        const PDF_URL = 'catalog.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pageFlipInstance = null;
        let pdfDoc = null;
        let currentWidth = window.innerWidth;

        // تشخیص نوع دستگاه
        function isMobileDevice() {
            return window.innerWidth <= 768;
        }

        // محاسبه ابعاد مناسب بر اساس نوع دستگاه
        function getFlipbookDimensions() {
            const isMobile = isMobileDevice();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            if (isMobile) {
                // حالت موبایل: تک صفحه‌ای، ابعاد بهینه برای نمایش A4
                // با احتساب padding، عرض رو کمی کمتر می‌گیریم
                const availableWidth = viewportWidth - 30;
                const availableHeight = viewportHeight - 60;
                
                // نسبت A4 (تقریبا 1:1.414)
                let w = availableWidth;
                let h = w * 1.414;
                
                // اگر ارتفاع از صفحه بیشتر شد، ارتفاع رو ملاک می‌گیریم
                if (h > availableHeight) {
                    h = availableHeight;
                    w = h / 1.414;
                }

                return {
                    width: Math.round(w),
                    height: Math.round(h),
                    minWidth: 200,
                    maxWidth: 600,
                    minHeight: 280,
                    maxHeight: 850,
                    usePortrait: true,
                    showCover: false,
                    size: 'fixed'
                };
            } else {
                // حالت دسکتاپ: 16:9 افقی، دو صفحه‌ای
                return {
                    width: 800,
                    height: 450,
                    minWidth: 400,
                    maxWidth: 1200,
                    minHeight: 225,
                    maxHeight: 675,
                    usePortrait: true,
                    showCover: true,
                    size: 'stretch'
                };
            }
        }

        // رندر کردن PDF و ساخت فلیپ بوک
        async function buildFlipbook() {
            if (!pdfDoc) return;

            const flipbookElement = document.getElementById('flipbook');
            flipbookElement.innerHTML = '';

            const isMobile = isMobileDevice();
            // کیفیت پایین‌تر در موبایل برای لود سریع‌تر
            const renderScale = isMobile ? 1.3 : 2.0;

            // رندر تمام صفحات
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: renderScale });
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const pageDiv = document.createElement('div');
                pageDiv.className = 'my-page';
                pageDiv.appendChild(canvas);
                
                flipbookElement.appendChild(pageDiv);
            }

            // نابود کردن نمونه قبلی
            if (pageFlipInstance) {
                try { pageFlipInstance.destroy(); } catch(e) {}
                pageFlipInstance = null;
            }

            // انتظار کوتاه برای اعمال layout
            await new Promise(r => setTimeout(r, 50));

            // تنظیمات فلیپ بوک
            const dims = getFlipbookDimensions();
            const config = {
                width: dims.width,
                height: dims.height,
                size: dims.size,
                minWidth: dims.minWidth,
                maxWidth: dims.maxWidth,
                minHeight: dims.minHeight,
                maxHeight: dims.maxHeight,
                drawShadow: true,
                flippingTime: isMobile ? 600 : 800,
                usePortrait: dims.usePortrait,
                startZIndex: 0,
                autoSize: true,
                maxShadowOpacity: 0.5,
                showCover: dims.showCover,
                mobileScrollSupport: false,
                direction: 'rtl',
                // در موبایل امکان swipe با لمس
                swipeDistance: 30,
                clickEventForward: true,
                useMouseEvents: true
            };

            pageFlipInstance = new St.PageFlip(flipbookElement, config);
            pageFlipInstance.loadFromHTML(document.querySelectorAll('.my-page'));
        }

        // بارگذاری اولیه PDF
        async function loadFlipbook() {
            try {
                pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('flipbook-container').style.display = 'block';

                await buildFlipbook();

            } catch (error) {
                console.error("Error loading PDF: ", error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').innerHTML = 
                    "خطا در بارگذاری فایل PDF.<br>لطفا مطمئن شوید فایل '" + PDF_URL + "' در همان پوشه فایل index.html قرار دارد.";
            }
        }

        // مدیریت تغییر اندازه/چرخش صفحه
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const newWidth = window.innerWidth;
                // فقط اگر تغییر قابل توجه بود (چرخش گوشی یا تغییر سایز پنجره)
                if (Math.abs(newWidth - currentWidth) > 50) {
                    currentWidth = newWidth;
                    if (pdfDoc) {
                        buildFlipbook();
                    }
                }
            }, 300);
        });

        window.onload = loadFlipbook;
    </script>
</body>
</html>
